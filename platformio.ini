[env:MZCMTEmu]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
; N16R8: match sdkconfig.defaults and the image/upload flash header.
board_upload.flash_size = 16MB
framework = espidf
monitor_speed = 115200
board_upload.before_reset = usb_reset
board_upload.after_reset = hard_reset

board_build.psram = enabled
build_type = debug
; PlatformIO debug flags follow IDF flags: keep symbols with fast code.
debug_build_flags = -O2 -g3


build_flags =
    -O2
